{% extends 'base.html' %}
{% block title %}提交成功 - SWUST 新生指南{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="mb-3" style="font-size: 4rem;">
        <i class="bi bi-check-circle text-success"></i>
    </div>
    <h1 class="h4 mb-3">提交成功</h1>
    <p class="text-muted mb-4">{{ message|default:"你的问题已提交成功，我们会尽快整理补充。" }}</p>
    <div class="d-flex justify-content-center gap-2">
        <a href="{% url 'home' %}" class="btn btn-primary">返回首页</a>
        <a href="{% url 'submit_question' %}" class="btn btn-outline-secondary">提交另一个问题</a>
    </div>
</div>
{% endblock %}
